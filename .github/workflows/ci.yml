name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: facebooklike
          POSTGRES_USER: facebooklike
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U facebooklike"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: localhost
      POSTGRES_DB: facebooklike
      POSTGRES_USER: facebooklike
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      # Tests swap in an in-memory cache, so no Redis server is needed here.
      REDIS_URL: redis://localhost:6379/0
      APP_NAME: GenZ
      SESSION_COOKIE_AGE_SECONDS: "1209600"
      LOGIN_PENDING_TTL_SECONDS: "600"
      ADMIN_INVITE_TTL_HOURS: "48"
      RECOVERY_CODE_COUNT: "10"
      API_PAGE_SIZE: "20"
      THROTTLE_LOGIN_IP_RATE: 20/h
      THROTTLE_LOGIN_ACCOUNT_RATE: 10/h
      THROTTLE_SECOND_STEP_RATE: 10/h
      THROTTLE_INVITE_RATE: 30/h
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: Backend/requirements.txt
      - run: pip install -r requirements.txt
      # A fresh random key per run, so no real secret lives in the repo.
      - run: echo "DJANGO_SECRET_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(50))')" >> "$GITHUB_ENV"
      - run: python manage.py check
      - run: python manage.py test

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.0"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
