name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: facebooklike
          POSTGRES_USER: facebooklike
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U facebooklike"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: localhost
      POSTGRES_DB: facebooklike
      POSTGRES_USER: facebooklike
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      # Tests swap in an in-memory cache, so no Redis server is needed here.
      REDIS_URL: redis://localhost:6379/0
      APP_NAME: GenZ
      SESSION_COOKIE_AGE_SECONDS: "1209600"
      LOGIN_PENDING_TTL_SECONDS: "600"
      ADMIN_INVITE_TTL_HOURS: "48"
      RECOVERY_CODE_COUNT: "10"
      API_PAGE_SIZE: "20"
      THROTTLE_LOGIN_IP_RATE: 20/h
      THROTTLE_LOGIN_ACCOUNT_RATE: 10/h
      THROTTLE_SECOND_STEP_RATE: 10/h
      THROTTLE_INVITE_RATE: 30/h
      # Tests swap in throwaway folders and never send jobs to the queue.
      MEDIA_ROOT: media
      MEDIA_URL: /media/
      PHOTO_ORIGINALS_ROOT: private_uploads
      POST_MAX_TEXT_LENGTH: "5000"
      POST_MAX_MEDIA: "10"
      PHOTO_MAX_UPLOAD_BYTES: "15728640"
      PHOTO_MAX_PIXELS: "50000000"
      PHOTO_FEED_MAX_PX: "1080"
      PHOTO_FULL_MAX_PX: "2048"
      PHOTO_WEBP_QUALITY: "82"
      VIDEO_MAX_UPLOAD_BYTES: "314572800"
      VIDEO_MAX_SECONDS: "180"
      VIDEO_MAX_PX: "1920"
      VIDEO_CRF: "23"
      VIDEO_AUDIO_BITRATE: 128k
      VIDEO_PROCESSING_TIMEOUT_SECONDS: "600"
      MUSIC_MAX_UPLOAD_BYTES: "20971520"
      FFMPEG_BINARY: /usr/bin/ffmpeg
      FFPROBE_BINARY: /usr/bin/ffprobe
      SITE_URL: http://localhost:5173
      DEVICE_COOKIE_AGE_SECONDS: "31536000"
      COMMENT_MAX_LENGTH: "1000"
      COMMENT_NAME_MAX_LENGTH: "40"
      THROTTLE_COMMENT_DEVICE_RATE: 10/h
      THROTTLE_COMMENT_IP_RATE: 30/h
      THROTTLE_REACTION_RATE: 120/h
      THROTTLE_SHARE_RATE: 60/h
      THROTTLE_FOLLOW_RATE: 10/h
      VAPID_SUBJECT: mailto:ci@example.com
      PUSH_TTL_SECONDS: "86400"
      PUSH_TIMEOUT_SECONDS: "10"
      PUSH_BATCH_SIZE: "500"
      PUSH_ALLOWED_HOSTS: fcm.googleapis.com,push.services.mozilla.com,push.apple.com,notify.windows.com
      PUSH_PRUNE_APPLY: "false"
      THROTTLE_APP_DEVICE_RATE: 20/h
      EXPO_PUSH_URL: https://exp.host/--/api/v2/push/send
      EXPO_PUSH_BATCH_SIZE: "100"
      EXPO_PUSH_MAX_RETRIES: "5"
      EXPO_RETRY_BASE_SECONDS: "5"
      EXPO_RECEIPTS_URL: https://exp.host/--/api/v2/push/getReceipts
      EXPO_RECEIPT_DELAY_SECONDS: "900"
      CHANNEL_REDIS_URL: redis://localhost:6379/2
      MESSAGE_MAX_LENGTH: "2000"
      GROUP_MAX_MEMBERS: "50"
      THROTTLE_MESSAGE_RATE: 60/m
      CELERY_BROKER_URL: redis://localhost:6379/1
      POST_REPAIR_INTERVAL_SECONDS: "600"
      POST_PROCESSING_TIMEOUT_SECONDS: "900"
      POST_PROCESSING_MAX_ATTEMPTS: "3"
      POST_REPAIR_BATCH_SIZE: "200"
      POST_REPAIR_APPLY: "false"
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: Backend/requirements.txt
      - run: pip install -r requirements.txt
      # Video tests convert real clips, so the worker's video tool must be present.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      # A fresh random key per run, so no real secret lives in the repo.
      - run: echo "DJANGO_SECRET_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(50))')" >> "$GITHUB_ENV"
      # Throwaway Web Push keys for this run only.
      - run: |
          python - >> "$GITHUB_ENV" <<'PY'
          import base64
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric import ec
          key = ec.generate_private_key(ec.SECP256R1())
          b64 = lambda b: base64.urlsafe_b64encode(b).rstrip(b"=").decode()
          print("VAPID_PRIVATE_KEY=" + b64(key.private_numbers().private_value.to_bytes(32, "big")))
          print("VAPID_PUBLIC_KEY=" + b64(key.public_key().public_bytes(serialization.Encoding.X962, serialization.PublicFormat.UncompressedPoint)))
          PY
      - run: python manage.py check
      - run: python manage.py test

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.0"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Lint the code shared with the phone app
        working-directory: .
        run: Frontend/node_modules/.bin/oxlint -c Frontend/.oxlintrc.json Shared
      - run: npm test

  mobile:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: Mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.0"
          cache: npm
          cache-dependency-path: Mobile/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
